[graph]
all-features = true
# Henk is deployed on Linux. Other targets pull in different TLS roots.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Our own crates are unpublished and carry no SPDX licence.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# TLS must stay on rustls with the ring provider and the platform's own
# certificate store. These crates appearing means a feature flag regressed.
deny = [
  { crate = "aws-lc-sys", reason = "TLS provider is ring; see README" },
  { crate = "aws-lc-rs", reason = "TLS provider is ring; see README" },
  { crate = "webpki-roots", reason = "certificates come from the platform store" },
  { crate = "webpki-root-certs", reason = "certificates come from the platform store" },
  { crate = "openssl-sys", reason = "TLS is rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
