# Meneer Henk configuration. See docs/SPEC.md.
#
# No credential goes in this file (spec §8.4). Every secret is named by the
# environment variable that holds it; the deployment fills those from
# OpenBao. Identity is always an id, never a display name (spec §2).

[server]
bind = "127.0.0.1:8080"
public_base_url = "https://henk.example.com"
github_webhook_secret_env = "HENK_GITHUB_WEBHOOK_SECRET"
gitlab_webhook_token_env = "HENK_GITLAB_WEBHOOK_TOKEN"
api_token_env = "HENK_API_TOKEN"
# Inbound events, what each listener did with them, and session transcripts
# are deleted after this many days. Runs are kept, since their links are posted.
keep_events_days = 30

[database]
# Where run records live: one SQLite file (the default) ...
backend = "sqlite"
path = "/var/lib/henk/henk.db"
# ... or PostgreSQL. The URL holds the password, so only the variable that
# has it goes here. Use sslmode=require (or verify-full) outside localhost.
# backend = "postgres"
# url_env = "HENK_DATABASE_URL"

[discord]
# The one channel Henk works in.
channel_id = 123456789012345678
# Henk's own bot user id. He never reacts to himself.
henk_user_id = 223456789012345678
# Henk's role id, if mentioning a role should count as mentioning him.
henk_role_id = 323456789012345678
# The "Collega van Henk" role id.
colleague_role_id = 423456789012345678
# Team Lead user ids. `sudo!` from these users is an order.
team_lead_ids = [523456789012345678]

[mail]
# The address Henk sends from. Mail from this address is never answered.
address = "henk@example.com"

[allowlist]
# Henk works only here (spec §2, §8.7).
github_repositories = ["StephanMeijer/scratch-repo"]
github_owners = ["docspec", "NotedThat"]
gitlab_projects = []
gitlab_groups = ["9xxlab"]

[github]
# The GitHub App. Its private key path comes from the environment.
app_id = 123456
# Henk acts for every installation of the App, on each account it is
# installed on, and works only where [allowlist] lets it: install the App
# on a user and an organisation, allowlist both, and Henk reviews in both.
# Each repository's work goes out as the installation on its account.
# To act for only some installations, name them (at most one of these):
# installation_id = 7654321
# installations = [7654321, 7654322]
private_key_path_env = "GITHUB_APP_PRIVATE_KEY_PATH"
bot_login = "meneer-henk[bot]"
mcp_server = "github"

[gitlab]
api_url = "https://gitlab.com/api/v4"
username = "meneerhenk"
token_env = "GITLAB_PERSONAL_ACCESS_TOKEN"
mcp_server = "gitlab"
write_mcp_server = "gitlab-write"

# Endpoints: where models are reached and how (#368). One per server or
# account; any number of the same provider, each with its own id. headers
# (optional) are sent with every request, for a gateway that wants them.
# An openai endpoint speaks Chat Completions; api = "responses" calls
# OpenAI's Responses API instead, which carries a reasoning model's
# reasoning from turn to turn (#365). See the README.
[endpoints.proxy]
provider = "openai"
base_url = "https://llm3.9xx.nl/v1"
api_key_env = "LLM3_API_KEY"
# headers = { "X-Team" = "henk" }

[endpoints.anthropic]
provider = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

# [endpoints.openai]
# provider = "openai"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# api = "responses"

# Models: what each model is and on which endpoint. The roles (the
# reviewer, the executor and the planner) refer to one of these by id.
[models.proxy-fast]
endpoint = "proxy"
model = "fast-model"
max_tokens = 4096

# max_tokens caps one answer. A reasoning model spends part of it on its
# thinking, so give one 16384 or more; an answer cut off at the cap costs
# a turn. Current Claude models always think.
#
# prompt_cache (Anthropic only, default true) marks the system prompt and
# the end of the conversation for caching, so each turn reads what the last
# one wrote at a fraction of the price. Set it false for a proxy that
# rejects cache_control.
[models.claude]
endpoint = "anthropic"
model = "claude-sonnet-5-5"
max_tokens = 16384

# effort: low, medium, high or xhigh, and max on Anthropic only, or none and
# minimal on OpenAI only. It sets how much the model thinks; left out, nothing is sent and
# the model's default applies, which for Claude Opus 5.5 is medium. Calls
# are not streamed, so a higher effort needs a longer timeout_secs.
# `henk config check` shows the parameter each model's effort is sent as.
[models.opus]
endpoint = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 16384
timeout_secs = 300

# On OpenAI, effort goes as reasoning_effort (Chat Completions) or
# reasoning.effort (Responses). Which levels a model takes depends on the
# model, and an OpenAI-compatible server may not take the parameter at all:
# set effort only where the endpoint supports it. A refusal names the
# setting; leave effort out to send nothing.
# [models.gpt]
# endpoint = "openai"
# model = "gpt-5.6"
# effort = "medium"
# max_tokens = 16384
# timeout_secs = 300

[review]
# Every turn resends the conversation. Past this many characters, the oldest
# tool results outside the last keep_recent_turns turns become one-line
# stubs; the session can call the tool again. Roughly 4 characters per token.
max_conversation_chars = 160000
keep_recent_turns = 2
max_concurrent = 3
# Changed files nobody reviews. A pattern without / matches the file name at
# any depth; ** matches any number of directories. This is the default; set
# it to replace the list, or to [] to review everything. A change made only
# of these files is reported as nothing to review.
ignore = [
  "**/Cargo.lock", "**/package-lock.json", "**/yarn.lock", "**/pnpm-lock.yaml",
  "**/go.sum", "**/poetry.lock", "**/uv.lock", "CHANGELOG.md",
]

# The review is a reviewer-executor loop (#283): the reviewer reviews, the
# executor fixes what holds in the same workspace and Henk pushes it to the
# pull request's branch, and each resumes its own conversation the next
# round, until the reviewer finds nothing more or max_rounds is reached.
# Nothing is posted on the pull request; the check says what the loop did.
# It needs [roles.reviewer] and [roles.executor] below. A pull request it may
# not push to (a fork, the default or a protected branch, or a branch that
# moved after the review was queued) is reviewed by the reviewer alone: one
# round, nothing pushed, and its findings in the check.
[review.loop]
max_rounds = 50
run_timeout_secs = 3600

# The web dashboard at /dashboard: sign in with GitHub. Only these GitHub
# user ids (find yours at https://api.github.com/users/<login>) get in, and
# each of them may start reviews and plans and cancel them.
# Sign-in uses a GitHub OAuth App, not Henk's GitHub App, so GitHub asks only
# who someone is. Its callback is {public_base_url}/dashboard/auth/callback.
# [dashboard]
# allowed_github_ids = [1234567]
# client_id_env = "HENK_DASHBOARD_CLIENT_ID"
# client_secret_env = "HENK_DASHBOARD_CLIENT_SECRET"
# session_key_env = "HENK_DASHBOARD_SESSION_KEY"
# session_hours = 12

# Henk's own MCP server at /mcp: an agent (Claude Code, an editor) can start
# reviews and plans, follow and cancel them, and read their health. Each client has a named token, kept in the variable
# env names; a read token may only read. What a client starts is asked by
# mcp:<name>. Off unless enabled; see README "MCP server".
# [mcp_server]
# enabled = true
# [[mcp_server.tokens]]
# name = "claude-code"
# env = "HENK_MCP_TOKEN_CLAUDE_CODE"
# scope = "write"
# [[mcp_server.tokens]]
# name = "reporting"
# env = "HENK_MCP_TOKEN_REPORTING"
# scope = "read"

# Planning an issue: the planner drafts a plan and its tracker changes, the
# reviewer reviews the draft and the planner revises, until the reviewer
# raises nothing more or max_rounds or run_timeout_secs ends it. Nothing
# reaches the issue before then. It needs [roles.planner] and
# [roles.reviewer] below.
[planning]
change_budget = 20
sub_issue_cap = 5
max_rounds = 3
run_timeout_secs = 3600
# CLI and API plans run on behalf of this Team Lead.
requester_id = 523456789012345678

# Taking an issue to a pull request (#329), on request only: the executor
# works on the default branch, Henk pushes a new branch under branch_prefix
# and opens a ready pull request that closes the issue, then reviews it. It
# needs [roles.executor] below; on GitHub the App needs "Pull requests:
# write", on GitLab create_merge_request in GITLAB_TOOLS.
[execution]
run_timeout_secs = 3600
branch_prefix = "henk/"

# Skills: the team's own instructions for one kind of work, one folder per
# skill with a SKILL.md (front matter with name and description, then
# Markdown). dir is relative to this file. A role gets only the skills it
# lists, as `skills = [...]` on its [roles.*] section;
# it sees their names and descriptions and loads one with load_skill. Only
# SKILL.md is read: scripts and other files in a skill folder are ignored.
# [skills]
# dir = "skills"

# The roles (#321): the agents Henk runs, each one model with its own
# limits, tools and skills. max_turns and timeout_secs hold per turn: a
# round of the review loop or of the plan review. The reviewer reviews both
# pull requests and plans. `tools` narrows a
# role's tools within what the role may ever have; left out, the role gets
# its defaults. Only the planner may have web_fetch, and a role that lists
# skills keeps load_skill. With [review.loop], the reviewer keeps
# report_finding and finish_round, and the executor list_findings and
# give_verdict. With [planning], the reviewer keeps raise_point and
# finish_round, and the planner write_plan and answer_point. `henk config check` lists each role's tools when
# they differ, and refuses a tool the role may not have. Moving from [address] and the old [review.loop] and [planning]
# keys: README, "Migrating to roles".
[roles.reviewer]
model = "opus"
max_turns = 40
timeout_secs = 600
# tools = ["list_changed_files", "get_file_diff", "list_files", "read_file", "search", "report_finding", "raise_point", "finish_round"]

[roles.planner]
model = "claude"
max_turns = 80
timeout_secs = 1200
# skills = ["issue-sizing"]

# The executor changes the code: in the review loop it fixes what holds and
# Henk pushes one fast-forward commit per round, "Fix review findings", to
# the pull request's branch (never a fork, the default branch, a protected
# branch or a branch that moved; spec §3.5). On GitHub the App needs
# "Contents: write"; on GitLab Henk pushes with [gitlab].token_env.
# requester_id is the Team Lead the executor belongs to. It credits nobody:
# a commit names only the requester who asked, when Henk knows them by id.
[roles.executor]
model = "claude"
max_turns = 40
timeout_secs = 600
max_changed_files = 20
# Henk runs no checks of his own: the executor finds the repository's
# checks (its CI, Makefile, AGENTS.md) and runs them with bash, and the
# pull request's CI decides.
requester_id = 523456789012345678
#
# Who Henk commits as, author and committer alike; his Signed-off-by uses
# the same. Left out, he commits as the App: meneer-henk[bot] with its
# GitHub noreply address.
# [roles.executor.identity]
# name = "Meneer Henk"
# email = "henk@example.com"
#
# The trailers of each commit, after Henk-Run and Requested-by. Only the
# requester who asked is credited, by the id they asked with or their
# [[people]] entry, never by a display name; a run nobody Henk knows by id
# asked for (CLI, HTTP API, webhook) credits no one.
# [roles.executor.trailers]
# henk_signoff = true          # Signed-off-by: Henk, for DCO checks
# requester_coauthor = true    # Co-authored-by: the colleague who asked
# requester_signoff = false    # Signed-off-by: the colleague who asked
#
# Per repository, by owner/name on the allowlist; a switch left out keeps
# the value above. A requester sign-off states that the requester certifies
# the DCO for a change they asked for but did not type: turning it on is
# the operator's statement that requesters in this repository agree to that.
# [roles.executor.repositories."StephanMeijer/scratch-repo"]
# requester_signoff = true

# Where the review loop's workspace is: the reviewer's and the executor's
# file tools, and their bash, run there. Henk copies the pull request's files
# into it; only the executor's checked changeset comes back, and he commits
# it in a fresh checkout nothing ran in. The "host" backend runs the setup
# steps as Henk's own user on this machine and gives no model bash, so no
# checks run there and the pull request's CI decides: not isolated, and only
# the time and output limits hold. `henk config check` says so.
# [workspace]
# backend = "host"
# command_secs = 600
# run_secs = 1800
# output_bytes = 20480
# A named profile takes what it leaves out from [workspace].
# [workspace.profiles.slow]
# command_secs = 1800
# [workspace.repositories]
# "docspec/big-repo" = "slow"
# The "ssh" backend runs each run as a throwaway user on a sandbox host.
# Henk signs in as root and brings its own script; nothing is installed
# there (README, "Sandbox host"). Runs share that host's kernel, /tmp and
# network. The host key is pinned.
# [workspace.profiles.sandbox]
# backend = "ssh"
# Before the model starts: the repository's own toolchain through mise
# in its safe mode (`mise install`, then `mise exec --` for every command), and
# the operator's setup commands, in order. Never steps from the repository.
# toolchain = "mise"
# setup = [["npm", "ci"]]
# Reviews get a workspace too: the review loop's, at the pull request's
# head, set up as above; only the executor's checked changes leave it. Refused
# on the host backend: a review runs setup on the pull request's code.
# review = true
# The planner gets a workspace too: the default branch, set up as above,
# never exported. Also refused on the host backend.
# plan = true
# [workspace.ssh]
# host = "sandbox.example.com"
# The host's key as `ssh-keyscan -t ed25519 sandbox.example.com` prints it.
# host_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHwggB+uDymUchQomPhkEutCeWIK/K4839d+5Gh4tMbx"
# port = 22
# user = "root"
# key_path_env = "HENK_SANDBOX_KEY_PATH"
# The most workspaces Henk keeps open on the host at once (#403), reviews,
# plans and execute runs alike; a run waits for room rather than overload
# it. Left out: no limit. With several hosts below, every host's default.
# max_concurrent = 2
# Several sandbox hosts instead of one (#389): a workspace opens on the
# least busy one a profile may use, and a host that cannot be reached is
# passed over. user, port and key_path_env above are every host's
# defaults; a host may set its own. It replaces host and host_key above:
# write one form or the other.
## [workspace.ssh.hosts.goat]
## host = "goat.example.com"
## host_key = "ssh-ed25519 AAAA..."
## max_concurrent = 8
## [workspace.ssh.hosts.fox]
## host = "fox.example.com"
## host_key = "ssh-ed25519 AAAA..."
## port = 2222
# A profile may keep to some of them; left out, it may use every host.
## [workspace.profiles.big]
## backend = "ssh"
## hosts = ["goat"]
# The "kubernetes" backend makes a Pod per workspace in a sandbox namespace
# of its own, apart from Henk's (README, "Workspaces on Kubernetes";
# deploy/kubernetes/). A profile's `image` overrides the one here.
# [workspace.profiles.pods]
# backend = "kubernetes"
# [workspace.kubernetes]
# namespace = "henk-sandbox"
# image = "registry.example/henk-sandbox:1"
# run_as_user = 1000
# runtime_class = "gvisor"
# kubeconfig_env = "KUBECONFIG"

# Limits every model session shares. A session that calls one tool with the
# same arguments max_repeated_calls times in a row has its next such call
# refused; one more in a later turn ends the session as stuck, and the run
# records it.
# The default is 3; 0 turns the guard off.
# [agent]
# max_repeated_calls = 3
# Every tool call goes on the run record with up to this many bytes of its
# arguments (code, paths, commands the model sent; never a credential). 0
# keeps none.
# record_argument_bytes = 4096

# External MCP servers. Henk is the client; nothing here is part of Henk.
# The read session reviewers and the planner see: read-only toolsets, no
# write tool at all. It signs in as the App with the key below; Henk sets
# GITHUB_APP_ID and GITHUB_APP_INSTALLATION_ID for each session, to the
# installation on the account of the repository it reads, so do not set
# them here.
[mcp.github]
command = "github-mcp-server"
args = ["stdio"]
env = { GITHUB_READ_ONLY = "1", GITHUB_TOOLSETS = "context,repos,pull_requests,issues,labels" }
pass_env = ["GITHUB_APP_PRIVATE_KEY_PATH"]
call_timeout_secs = 60

# GitLab reads: read-only mode, no write tool exists in the session.
[mcp.gitlab]
command = "npx"
args = ["-y", "@zereight/mcp-gitlab@2.1.68"]
env = { GITLAB_API_URL = "https://gitlab.com/api/v4", GITLAB_PERMISSION_MODE = "readonly" }
pass_env = ["GITLAB_PERSONAL_ACCESS_TOKEN"]
call_timeout_secs = 60

# GitLab writes, driven by Henk's own code only (never by a model).
[mcp.gitlab-write]
command = "npx"
args = ["-y", "@zereight/mcp-gitlab@2.1.68"]
env = { GITLAB_API_URL = "https://gitlab.com/api/v4", GITLAB_PERMISSION_MODE = "modify", GITLAB_TOOLS = "get_merge_request,mr_discussions,create_merge_request_thread,create_merge_request_note,update_merge_request_note,create_merge_request_discussion_note,create_merge_request_emoji_reaction,create_merge_request_note_emoji_reaction,create_commit_status,get_merge_request_diffs,resolve_merge_request_thread,get_issue,update_issue,create_issue,create_issue_note,create_issue_link,list_labels,get_work_item,update_work_item,create_work_item,convert_work_item_type,create_work_item_note,create_merge_request" }
pass_env = ["GITLAB_PERSONAL_ACCESS_TOKEN"]
call_timeout_secs = 60

# People Henk knows by id (spec §2, "Known people").
[[people]]
discord_id = 523456789012345678
name = "Stephan"
role = "team lead"
# Platform user ids (not logins): a commit Henk pushes for a review
# Stephan asked for credits him as <id>+<login>@users.noreply.github.com on GitHub, or
# <id>-<username>@users.noreply.<host> on GitLab with the host of
# [gitlab].api_url, with the login read from the platform at run time.
# `curl https://api.github.com/users/<login>` shows a GitHub id.
github_id = 1234567
# gitlab_id = 7654321
# Or credit him with this name and email instead; set both or neither.
# commit_name = "Stephan Meijer"
# commit_email = "stephan@example.com"
