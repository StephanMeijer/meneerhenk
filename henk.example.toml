# Meneer Henk configuration. See docs/SPEC.md.
#
# No credential goes in this file (spec §8.4). Every secret is named by the
# environment variable that holds it; the deployment fills those from
# OpenBao. Identity is always an id, never a display name (spec §2).

[server]
bind = "127.0.0.1:8080"
public_base_url = "https://henk.example.com"
database_path = "/var/lib/henk/henk.db"
github_webhook_secret_env = "HENK_GITHUB_WEBHOOK_SECRET"
gitlab_webhook_token_env = "HENK_GITLAB_WEBHOOK_TOKEN"
api_token_env = "HENK_API_TOKEN"

[discord]
# The one channel Henk works in.
channel_id = 123456789012345678
# Henk's own bot user id. He never reacts to himself.
henk_user_id = 223456789012345678
# Henk's role id, if mentioning a role should count as mentioning him.
henk_role_id = 323456789012345678
# The "Collega van Henk" role id.
colleague_role_id = 423456789012345678
# Team Lead user ids. `sudo!` from these users is an order.
team_lead_ids = [523456789012345678]

[mail]
# The address Henk sends from. Mail from this address is never answered.
address = "henk@example.com"

[allowlist]
# Henk works only here (spec §2, §8.7).
github_repositories = ["StephanMeijer/scratch-repo"]
github_owners = ["docspec", "NotedThat"]
gitlab_projects = []
gitlab_groups = ["9xxlab"]

[github]
# The GitHub App. Its private key path comes from the environment.
app_id = 123456
installation_id = 7654321
private_key_path_env = "GITHUB_APP_PRIVATE_KEY_PATH"
bot_login = "meneer-henk[bot]"
mcp_server = "github"

[gitlab]
api_url = "https://gitlab.com/api/v4"
username = "meneerhenk"
token_env = "GITLAB_PERSONAL_ACCESS_TOKEN"
mcp_server = "gitlab"
write_mcp_server = "gitlab-write"

# Models. Each lane and the planner refer to one of these by id.
[models.proxy-fast]
provider = "open_ai"
base_url = "https://llm3.9xx.nl/v1"
api_key_env = "LLM3_API_KEY"
model = "fast-model"
max_tokens = 4096

# max_tokens caps one answer. A reasoning model spends part of it on its
# thinking, so give one 16384 or more; an answer cut off at the cap costs
# a turn. Current Claude models always think.
[models.claude]
provider = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-5-5"
max_tokens = 16384

# effort (Anthropic only): low, medium, high, xhigh or max. It sets how much
# the model thinks; left out, the model's default applies, which for Claude
# Opus 5.5 is medium. Calls are not streamed, so a higher effort needs a
# longer timeout_secs.
[models.opus]
provider = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 16384
timeout_secs = 300

[review]
# Lanes are independent reviewers. Names appear in summaries when a lane
# does not finish, so they must not name a model (spec §3.2).
lanes = [
  { name = "lane-a", model = "proxy-fast" },
  { name = "lane-b", model = "claude" },
]
# A lane waits for the fact-check of each of its findings, and that time
# counts against its limit.
lane_timeout_secs = 900
lane_max_turns = 40
# Every turn resends the conversation. Past this many characters, the oldest
# tool results outside the last keep_recent_turns turns become one-line
# stubs; the lane can call the tool again. Roughly 4 characters per token.
max_conversation_chars = 160000
keep_recent_turns = 2
max_concurrent = 3
github_drafts = false

# A second model checks every finding, rewrite and withdrawal before it is
# made (spec §3.2). A rejected finding is not posted; the lane hears why.
# backup_model checks when the lane itself runs on model, or when model
# gives no verdict. When neither does, the finding is posted unchecked and
# the run says so. Leave the section out to post unchecked.
[review.fact_check]
model = "opus"
backup_model = "claude"
timeout_secs = 180
max_turns = 12

[planning]
model = "claude"
timeout_secs = 1200
max_turns = 80
change_budget = 20
sub_issue_cap = 5
# CLI and API plans run on behalf of this Team Lead.
requester_id = 523456789012345678

# External MCP servers. Henk is the client; nothing here is part of Henk.
# The read session a lane sees: read-only toolsets, no write tool at all.
[mcp.github]
command = "github-mcp-server"
args = ["stdio"]
env = { GITHUB_READ_ONLY = "1", GITHUB_TOOLSETS = "context,repos,pull_requests,issues,labels", GITHUB_APP_ID = "123456", GITHUB_APP_INSTALLATION_ID = "7654321" }
pass_env = ["GITHUB_APP_PRIVATE_KEY_PATH"]
call_timeout_secs = 60

# GitLab reads for lanes: read-only mode, no write tool exists in the session.
[mcp.gitlab]
command = "npx"
args = ["-y", "@zereight/mcp-gitlab@2.1.68"]
env = { GITLAB_API_URL = "https://gitlab.com/api/v4", GITLAB_PERMISSION_MODE = "readonly" }
pass_env = ["GITLAB_PERSONAL_ACCESS_TOKEN"]
call_timeout_secs = 60

# GitLab writes, driven by Henk's own code only (never by a model).
[mcp.gitlab-write]
command = "npx"
args = ["-y", "@zereight/mcp-gitlab@2.1.68"]
env = { GITLAB_API_URL = "https://gitlab.com/api/v4", GITLAB_PERMISSION_MODE = "modify", GITLAB_TOOLS = "get_merge_request,mr_discussions,create_merge_request_thread,create_merge_request_note,update_merge_request_note,create_merge_request_discussion_note,create_merge_request_emoji_reaction,create_merge_request_note_emoji_reaction,create_commit_status,get_issue,update_issue,create_issue,create_issue_note,create_issue_link,list_labels" }
pass_env = ["GITLAB_PERSONAL_ACCESS_TOKEN"]
call_timeout_secs = 60

# People Henk knows by id (spec §2, "Known people").
[[people]]
discord_id = 523456789012345678
name = "Stephan"
role = "team lead"
