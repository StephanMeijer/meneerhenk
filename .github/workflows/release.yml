# Tag-triggered release pipeline.
#
# Fired by the `vX.Y.Z` tag that `release-plz-release` in ci.yml pushes, by
# dispatch (see below). release-plz has already created the GitHub Release
# with the changelog as its body; this workflow builds, signs and attests the
# artifacts and appends them to it. Nothing goes to a registry of crates.
#
#   plan                    dist plan emits the per-target matrix
#   build-local-artifacts   per-target binary archives (matrix)
#   build-global-artifacts  shell installer and the combined checksums
#   attest                  SLSA build provenance for every artifact
#   sign                    cosign keyless sign-blob, one .bundle per artifact
#   docker                  multi-arch image on GHCR, signed and attested
#   release                 append the signed artifacts to the GitHub Release
#
# The build jobs follow cargo-dist v0.32.0's `ci.github.artifacts_matrix`
# output. Do not rename the matrix fields (matrix.runner, matrix.targets,
# matrix.dist_args, matrix.install_dist.run, matrix.packages_install): they
# are cargo-dist's contract. `dist plan --output-format=json` shows them.

name: Release

on:
  push:
    tags:
      - 'v*'
  # release-plz-release pushes the tag with GITHUB_TOKEN, and GitHub fires no
  # workflow for a push made that way (recursion prevention). workflow_dispatch
  # is the documented exception: ci.yml runs `gh workflow run release.yml
  # --ref <tag>`.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/stephanmeijer/meneerhenk

permissions: {}

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
    steps:
      # A dispatch from a branch would build a release out of whatever the
      # branch holds and attach it to no release at all. Refuse it up front.
      - name: Require a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "${REF}" in
            refs/tags/v[0-9]*) echo "releasing ${REF#refs/tags/}" ;;
            *) echo "::error::release.yml runs on a vX.Y.Z tag, not on ${REF}"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh

      - name: Cache dist for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        name: dist plan
        run: |
          dist plan --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload plan manifest
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # One entry per target from the plan: x86_64 on ubuntu-22.04 and aarch64 on
  # the native ubuntu-22.04-arm runner. Each entry brings its own runner,
  # installer command and dist arguments, so the job body is target-agnostic.
  # The toolchain is rust-toolchain.toml's; rustup installs it on first use.
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.manifest).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: rustup toolchain install

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - name: Install packages
        run: |
          ${{ matrix.packages_install }}

      - name: Build artifacts
        run: dist build --output-format=json ${{ matrix.dist_args }} > dist-manifest.json

      - id: cargo-dist
        name: Extract upload paths
        shell: bash
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload local artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # The installer and the combined checksums need every per-target manifest,
  # which is why this waits on the matrix without using it.
  build-global-artifacts:
    name: build-global-artifacts
    needs: [plan, build-local-artifacts]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch per-target manifests and artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: cargo-dist
        shell: bash
        run: |
          dist build --output-format=json --artifacts=global > dist-manifest.json
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload global artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  attest:
    name: Generate binary attestations
    needs: [build-local-artifacts, build-global-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-*
          path: artifacts
          merge-multiple: true

      # The dist manifests come along in the download but are not something
      # anybody pulls from the release; attest only what users get.
      - name: Remove internal manifests
        run: rm -f artifacts/*-dist-manifest.json

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'artifacts/*'

  sign:
    name: Sign binaries
    needs: [build-local-artifacts, build-global-artifacts]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-*
          path: artifacts
          merge-multiple: true

      - name: Remove internal manifests
        run: rm -f artifacts/*-dist-manifest.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.4.0

      # One .bundle sidecar per artifact, carrying signature and certificate.
      - name: Sign artifacts with cosign (keyless)
        run: |
          set -euo pipefail
          for artifact in artifacts/*; do
            case "${artifact}" in
              *.bundle) continue ;;
            esac
            if [ -f "${artifact}" ]; then
              echo "Signing: ${artifact}"
              cosign sign-blob --bundle "${artifact}.bundle" --yes "${artifact}"
            fi
          done

      - name: Upload signed artifacts (with .bundle sidecars)
        uses: actions/upload-artifact@v7
        with:
          name: signed-artifacts
          path: artifacts

  # One multi-platform build on one amd64 runner, with no QEMU and no
  # per-architecture merge. The Dockerfile cross-compiles henk on
  # $BUILDPLATFORM and the arm64 runtime stages only COPY, so nothing runs
  # under emulation. Adding a platform is a Dockerfile change first.
  docker:
    name: Publish Docker image
    needs: plan
    runs-on: ubuntu-latest
    # A backstop against a runaway build, set far above a cold one.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ANNOTATIONS_LEVELS=index puts the OCI metadata on the manifest list,
      # which has no labels of its own; the images carry the Dockerfile's
      # LABELs. No licence label: the project is UNLICENSED.
      - name: Image tags and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Meneer Henk
            org.opencontainers.image.description=Advisory code reviewer and issue planner for GitHub and GitLab
            org.opencontainers.image.source=https://github.com/StephanMeijer/meneerhenk
            org.opencontainers.image.url=https://github.com/StephanMeijer/meneerhenk

      # metadata-action gives an empty version when the ref is not semver;
      # pushing then would publish an image with no version tag.
      - name: Verify the resolved version is non-empty
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "::error::docker/metadata-action produced no version for ${REF_NAME}"
            exit 1
          fi
          echo "Publishing image version: ${VERSION}"

      # provenance and sbom off: BuildKit would add attestation manifests to
      # the index as `unknown/unknown` platforms, and `cosign --recursive`
      # would sign those too. Provenance is attested once, on the index, below.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A manifest list that lost a platform still resolves and still pulls on
      # an amd64 laptop; arm64 users get "no matching manifest". Assert both
      # before anything signs it.
      - name: Verify the published index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ] || { echo "::error::build produced no digest"; exit 1; }
          platforms=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
                       --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          for want in linux/amd64 linux/arm64; do
            case " ${platforms} " in
              *" ${want} "*) ;;
              *) echo "::error::index ${DIGEST} is missing ${want} (has: ${platforms})"; exit 1 ;;
            esac
          done
          echo "index ${DIGEST} carries: ${platforms}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.4.0

      # The index is what a tag resolves to, so `cosign verify image:tag`
      # looks for a signature there. `--recursive` also signs each platform
      # image, for verifiers that resolve to a platform digest first.
      - name: Sign the manifest list and its children (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      # `gh attestation verify oci://ghcr.io/stephanmeijer/meneerhenk:TAG
      # --owner StephanMeijer` resolves the tag to the index; one attestation
      # there covers every platform.
      - name: SLSA provenance for the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Append binaries, installer and cosign bundles to the release that
  # release-plz created. `append_body: false` keeps its changelog body.
  release:
    name: Attach artifacts to GitHub Release
    needs: [plan, build-local-artifacts, build-global-artifacts, attest, sign, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v8
        with:
          name: signed-artifacts
          path: release-artifacts

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          append_body: false
          fail_on_unmatched_files: true
          make_latest: ${{ !contains(github.ref_name, '-') }}
