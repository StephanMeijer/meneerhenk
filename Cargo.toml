[workspace]
resolver = "3"
members = [
  "crates/henk-domain",
  "crates/henk-llm",
  "crates/henk-mcp",
  "crates/henk-agent",
  "crates/henk-session",
  "crates/henk-events",
  "crates/henk-platform",
  "crates/henk-store",
  "crates/henk",
]

[workspace.package]
version = "0.1.17"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false
repository = "https://github.com/StephanMeijer/meneerhenk"

[workspace.dependencies]
henk-domain = { path = "crates/henk-domain" }
henk-llm = { path = "crates/henk-llm" }
henk-mcp = { path = "crates/henk-mcp" }
henk-agent = { path = "crates/henk-agent" }
henk-session = { path = "crates/henk-session" }
henk-events = { path = "crates/henk-events" }
henk-platform = { path = "crates/henk-platform" }
henk-store = { path = "crates/henk-store" }

anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "form", "tokio", "tracing", "matched-path"] }
base64 = "0.23"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
ring = "0.17"
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
secrecy = "0.10"
# SSH to the sandbox host (workspace backend "ssh", #84). Pure Rust on ring,
# so Henk's distroless image needs no ssh binary and deny.toml's aws-lc ban
# holds; compression and RSA keys are left out.
russh = { version = "0.64", default-features = false, features = ["ring"] }
# Packs a checkout to send to the sandbox host; xattrs are not carried.
tar = { version = "0.4", default-features = false }
# The kubernetes workspace backend (#89): Pods and pods/exec through the API
# server, in-cluster or from a kubeconfig. rustls on ring, exec over
# websockets; no aws-lc, no bundled roots, no controller runtime.
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["std", "earliest"] }
# The code tools' `search` pattern (#90): checked in Henk before any backend
# sees it, and matched with it on the host backend. Already in the lockfile
# through wiremock, a dev-dependency, so it adds no new crate.
regex = { version = "1.13", default-features = false, features = ["std", "unicode", "perf"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "signal", "fs", "net"] }
tokio-util = { version = "0.7", default-features = false }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-time-0_3"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
tower-http = { version = "0.7", default-features = false, features = ["trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter", "json"] }
wiremock = "0.6"

# cargo-dist builds the release binaries (.github/workflows/release.yml).
# Only `henk` opts in, via [package.metadata.dist] in its own manifest; the
# library crates stay library-only. Linux only: Henk is deployed on Linux
# (deny.toml judges the same two targets), and the container image is the
# main way to run it, since it also needs the MCP servers it starts.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
# release.yml is maintained by hand on top of what `dist generate` writes.
allow-dirty = ["ci"]
ci = ["github"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
installers = ["shell"]
unix-archive = ".tar.xz"
checksum = "sha256"
publish-prereleases = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dist]
inherits = "release"
