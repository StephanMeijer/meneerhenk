[package]
name = "henk"
description = "Meneer Henk: the team's AI colleague on GitHub, GitLab, Discord and email"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[package.metadata.dist]
# The one crate cargo-dist packages; `publish = false` excludes it otherwise.
dist = true

[[bin]]
name = "henk"
path = "src/main.rs"

[dependencies]
henk-domain = { workspace = true }
henk-events = { workspace = true }
henk-llm = { workspace = true }
henk-mcp = { workspace = true }
henk-agent = { workspace = true }
henk-platform = { workspace = true }
henk-session = { workspace = true }
henk-store = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
secrecy = { workspace = true }
russh = { workspace = true }
tar = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
henk-llm = { workspace = true, features = ["testing"] }
henk-mcp = { workspace = true, features = ["testing"] }
hmac = { workspace = true }
wiremock = { workspace = true }
sha2 = { workspace = true }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
# An HTTPS server for the web_fetch redirect tests; ring only, as deny.toml
# bans aws-lc.
rustls = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
