[package]
name = "henk-session"
description = "One abstract way to run a model session with tools, limits and run bookkeeping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
henk-agent = { workspace = true }
henk-domain = { workspace = true }
henk-llm = { workspace = true }
henk-mcp = { workspace = true }
henk-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# A small tool of the tests' own, to record its calls (#190).
async-trait = { workspace = true }
henk-llm = { workspace = true, features = ["testing"] }
henk-mcp = { workspace = true, features = ["testing"] }
rmcp = { workspace = true, features = ["server"] }

[lints]
workspace = true
